# Trusted ff.ai workflow pinned to a verified commit.
name: AI review with ff.ai

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ffai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ivanshchitov/ff.ai/.github/workflows/pr-review.yml@0a479d04cbb1f080f780eda0d25a751185a2f48d
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
