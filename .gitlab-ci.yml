stages:
  - build
default:
  before_script:
    - /home/gitlab-runner/Aurora5PlatformSDK/sdks/aurora_psdk/sdk-chroot
    - export CLIENT_ID="c24eecb6677c4ed1a38aacc835878d0c"
    - export CLIENT_SECRET="df7fb0c709664470bd3f8995e34ee2cd"
    - exit

build-aurora_5_1_0_100_aarch64:
  stage: build
  tags:
    - aurora_psdk_runner
  artifacts:
    paths:
      - ./artifacts/*.rpm
  script:
    - /home/gitlab-runner/Aurora5PlatformSDK/sdks/aurora_psdk/sdk-chroot ./build.sh -a ./ -t AuroraOS-5.1.0.100-base-aarch64

